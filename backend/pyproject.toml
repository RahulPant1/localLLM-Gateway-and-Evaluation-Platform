[project]
name = "llm-gateway"
version = "0.1.0"
description = "Local LLM gateway: routing, execution and blind evaluation of local models"
authors = [
    { name = "RahulPant1" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: needs the real Ollama service and loads a model onto the GPU"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Long regular-expression tables read better unwrapped.
"src/llm_gateway/routing/signals.py" = ["E501"]
"scripts/*" = ["E501"]
