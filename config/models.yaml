# Model registry and routing policy. Edit freely; the backend reads it at startup.
#
# A model that Ollama has but this file does not list is still usable by
# manual selection. It is shown as "unprofiled" and is never chosen
# automatically, except as a last resort when nothing listed is available.

# The small model asked to classify a request when the quick rules are unsure.
classifier_model: qwen3.5:4b

models:
  qwen3.5:4b:
    strengths: Fast general-purpose model. Good at short answers, classification, extraction and structured output.
  qwen2.5-coder:7b:
    strengths: Code generation, debugging and code review. Does not emit thinking text, so it is quick.
  deepseek-r1:8b:
    strengths: Step-by-step reasoning and analysis. Always thinks first, so it is the slowest.
  MedAIBase/MedGemma1.5:4b-it-q8_0:
    strengths: Clinical and medical-document understanding. Small context window (4096 tokens).

# For each task category, the models to try, best first.
#   default: used for any complexity without its own list.
#   low / medium / high: optional lists for that complexity.
# Models inside an inner [ ] are equally suitable; the one already loaded on
# the GPU is preferred, which avoids a model swap of about 6 seconds.
policy:
  general_qa:
    default: [qwen3.5:4b, deepseek-r1:8b]
    high: [deepseek-r1:8b, qwen3.5:4b]
  classification:
    default: [qwen3.5:4b, deepseek-r1:8b]
  extraction:
    default: [qwen3.5:4b, qwen2.5-coder:7b]
  structured_output:
    default: [[qwen3.5:4b, qwen2.5-coder:7b], deepseek-r1:8b]
  reasoning:
    default: [deepseek-r1:8b, qwen3.5:4b]
    low: [qwen3.5:4b, deepseek-r1:8b]
  coding:
    default: [qwen2.5-coder:7b, qwen3.5:4b]
  medical:
    default: [MedAIBase/MedGemma1.5:4b-it-q8_0, qwen3.5:4b]

# Tried in this order when no model listed for the category is installed.
last_resort: [qwen3.5:4b, deepseek-r1:8b, qwen2.5-coder:7b]
